<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Gemela de sound-on.svg en estado silenciado: misma placa, nota apagada y tachón carmesí.
       Paleta del tema: #4a4948 / #6a6866 (metal), #c91a10 (carmesí), #14120e (contorno). -->
  <defs>
    <linearGradient id="soundOffFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f6d6a" />
      <stop offset="45%" stop-color="#3b3a39" />
      <stop offset="100%" stop-color="#1a1918" />
    </linearGradient>
    <linearGradient id="soundOffFace" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#4b4946" />
      <stop offset="55%" stop-color="#312f2e" />
      <stop offset="100%" stop-color="#211f1e" />
    </linearGradient>
  </defs>

  <!-- Marco biselado -->
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="4" fill="url(#soundOffFrame)" stroke="#14120e" stroke-width="2.5" />
  <!-- Cara hundida -->
  <rect x="7" y="7" width="50" height="50" rx="3" fill="url(#soundOffFace)" stroke="#14120e" stroke-width="1.5" />

  <!-- Doble corchea atenuada: mismas coordenadas que sound-on.svg, en gris para leerse "apagada" -->
  <g fill="#77746f" opacity="0.85">
    <ellipse cx="22.5" cy="44" rx="7.6" ry="5.6" transform="rotate(-18 22.5 44)" />
    <ellipse cx="42.6" cy="39.6" rx="7.6" ry="5.6" transform="rotate(-18 42.6 39.6)" />
    <rect x="27.6" y="19" width="3.4" height="25.6" />
    <rect x="46.2" y="14.4" width="3.4" height="25.6" />
    <path d="M27.6 18.6 L49.6 13.8 V20.9 L27.6 25.7 Z" />
  </g>

  <!-- Tachón: trazo oscuro de base + carmesí encima, para que se lea sobre nota y sobre metal -->
  <g stroke-linecap="round" fill="none">
    <path d="M15 49 L49 15" stroke="#14120e" stroke-width="9" />
    <path d="M15 49 L49 15" stroke="#c91a10" stroke-width="4.5" />
    <path d="M16.5 47 L47.5 16.5" stroke="#f05a4a" stroke-width="1.4" opacity="0.7" />
  </g>
</svg>
