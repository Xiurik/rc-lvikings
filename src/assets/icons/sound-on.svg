<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Botón de música de OSRS: placa metálica con relieve y doble corchea. Estado: sonido activo.
       Paleta del tema: #4a4948 / #6a6866 (metal), #14120e (contorno). -->
  <defs>
    <linearGradient id="soundOnFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d8b88" />
      <stop offset="45%" stop-color="#4a4948" />
      <stop offset="100%" stop-color="#211f1e" />
    </linearGradient>
    <linearGradient id="soundOnFace" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#5f5d59" />
      <stop offset="55%" stop-color="#3d3c3a" />
      <stop offset="100%" stop-color="#2a2928" />
    </linearGradient>
  </defs>

  <!-- Marco biselado -->
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="4" fill="url(#soundOnFrame)" stroke="#14120e" stroke-width="2.5" />
  <!-- Cara hundida -->
  <rect x="7" y="7" width="50" height="50" rx="3" fill="url(#soundOnFace)" stroke="#14120e" stroke-width="1.5" />

  <!-- Doble corchea -->
  <g fill="#14120e">
    <ellipse cx="22.5" cy="44" rx="7.6" ry="5.6" transform="rotate(-18 22.5 44)" />
    <ellipse cx="42.6" cy="39.6" rx="7.6" ry="5.6" transform="rotate(-18 42.6 39.6)" />
    <rect x="27.6" y="19" width="3.4" height="25.6" />
    <rect x="46.2" y="14.4" width="3.4" height="25.6" />
    <path d="M27.6 18.6 L49.6 13.8 V20.9 L27.6 25.7 Z" />
  </g>
  <!-- Brillo superior de la viga, para que la nota no se empaste al reducir -->
  <path d="M27.6 18.6 L49.6 13.8 V15.6 L27.6 20.4 Z" fill="#5f5d59" opacity="0.45" />
</svg>
